<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — Elementals</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #24292e;
    background: #ffffff;
    margin: 0;
  }
  .container {
    max-width: 640px;
    margin: 96px auto;
    padding: 0 24px;
    text-align: center;
  }
  h1 {
    font-size: 2em;
    padding-bottom: 0.3em;
    margin: 0 0 24px;
    border-bottom: 1px solid #eaecef;
  }
  p {
    font-size: 1.1em;
    line-height: 1.6;
  }
  form {
    text-align: left;
    margin-top: 32px;
  }
  label {
    display: block;
    font-size: 0.95em;
    font-weight: 600;
    margin: 16px 0 4px;
  }
  input[type="password"] {
    width: 100%;
    box-sizing: border-box;
    font-size: 1em;
    padding: 8px 12px;
    border: 1px solid #d1d5da;
    border-radius: 6px;
  }
  button {
    display: block;
    width: 100%;
    margin-top: 24px;
    padding: 10px 16px;
    font-size: 1em;
    font-weight: 600;
    color: #ffffff;
    background: #0366d6;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:disabled {
    background: #959da5;
    cursor: default;
  }
  #message {
    margin-top: 20px;
    font-size: 1em;
    line-height: 1.6;
  }
  #message.error {
    color: #cb2431;
  }
  #message.success {
    color: #22863a;
  }
  [hidden] {
    display: none !important;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Elementals</h1>
    <p id="intro">Choose a new password for your account.</p>

    <form id="reset-form">
      <label for="new-password">New password</label>
      <input type="password" id="new-password" name="new-password" autocomplete="new-password" required>

      <label for="confirm-password">Confirm password</label>
      <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required>

      <button type="submit" id="submit-button">Reset password</button>
    </form>

    <p id="message" role="status" hidden></p>
  </div>

<script>
(function () {
  // Sandbox backend. Change this when the custom domain lands.
  var API_BASE = 'https://elementalsgame-sandbox.up.railway.app';

  var form = document.getElementById('reset-form');
  var newPasswordInput = document.getElementById('new-password');
  var confirmPasswordInput = document.getElementById('confirm-password');
  var submitButton = document.getElementById('submit-button');
  var messageEl = document.getElementById('message');
  var introEl = document.getElementById('intro');

  var params = new URLSearchParams(location.search);
  var token = params.get('token');

  function showMessage(text, kind) {
    messageEl.textContent = text;
    messageEl.className = kind || '';
    messageEl.hidden = false;
  }

  function hideForm() {
    form.hidden = true;
    introEl.hidden = true;
  }

  if (!token) {
    hideForm();
    showMessage('This link is invalid or already used.', 'error');
    return;
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();

    var newPassword = newPasswordInput.value;
    var confirmPassword = confirmPasswordInput.value;

    if (newPassword.length < 6) {
      showMessage('Password must be at least 6 characters.', 'error');
      return;
    }
    if (newPassword !== confirmPassword) {
      showMessage('Passwords do not match.', 'error');
      return;
    }

    submitButton.disabled = true;
    showMessage('Resetting your password…', '');

    fetch(API_BASE + '/api/auth/password/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, newPassword: newPassword })
    }).then(function (response) {
      if (response.ok) {
        hideForm();
        showMessage('Password changed. Sign in with your new password.', 'success');
        return;
      }

      if (response.status === 400) {
        return response.json().then(function (data) {
          var code = data && data.error;
          if (code === 'TOKEN_EXPIRED') {
            hideForm();
            showMessage('This link has expired. Request a new one from the app.', 'error');
          } else if (code === 'TOKEN_INVALID') {
            hideForm();
            showMessage('This link is invalid or already used.', 'error');
          } else {
            showMessage('Something went wrong. Please try again.', 'error');
            submitButton.disabled = false;
          }
        }, function () {
          showMessage('Something went wrong. Please try again.', 'error');
          submitButton.disabled = false;
        });
      }

      showMessage('Something went wrong. Please try again.', 'error');
      submitButton.disabled = false;
    }).catch(function () {
      showMessage('Something went wrong. Please try again.', 'error');
      submitButton.disabled = false;
    });
  });
})();
</script>
</body>
</html>
